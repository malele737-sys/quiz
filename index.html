<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近代史答题软件</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --purple: #8b5cf6;
            --purple-light: #ede9fe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 顶部导航 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            border-radius: 12px;
            font-size: 14px;
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        /* 章节选择 */
        .chapter-select {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .chapter-select h2 {
            font-size: 20px;
            color: var(--gray-800);
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .chapter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .chapter-btn {
            padding: 12px 20px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--gray-700);
            font-weight: 500;
        }
        
        .chapter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        
        .chapter-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        
        /* 题目卡片 */
        .question-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-num {
            font-size: 14px;
            color: var(--gray-500);
            font-weight: 500;
        }
        
        .question-type {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .type-single {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #1e40af;
        }
        
        .type-multi {
            background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
            color: #6d28d9;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            color: var(--gray-800);
            margin-bottom: 28px;
            font-weight: 500;
        }
        
        /* 选项 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .option {
            display: flex;
            align-items: flex-start;
            padding: 18px;
            border: 2px solid var(--gray-200);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fff;
        }
        
        .option:hover {
            border-color: var(--primary-light);
            background: var(--gray-50);
            transform: translateX(4px);
        }
        
        .option.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        
        .option.correct {
            border-color: var(--success);
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }
        
        .option.wrong {
            border-color: var(--danger);
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }
        
        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gray-600);
            margin-right: 14px;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .option.selected .option-letter {
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            color: #fff;
        }
        
        .option.correct .option-letter {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: #fff;
        }
        
        .option.wrong .option-letter {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: #fff;
        }
        
        .option-text {
            flex: 1;
            line-height: 1.6;
            color: var(--gray-700);
        }
        
        /* 多选提示 */
        .multi-hint {
            margin-top: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--warning-light) 0%, #fde68a 100%);
            border-radius: 10px;
            font-size: 14px;
            color: #92400e;
            font-weight: 500;
        }
        
        /* 底部操作栏 */
        .action-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .wrong-set-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--warning-light) 0%, #fde68a 100%);
            border-radius: 12px;
        }
        
        .wrong-set-option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .wrong-set-option label {
            font-size: 15px;
            color: #92400e;
            cursor: pointer;
            font-weight: 500;
        }
        
        .buttons {
            display: flex;
            gap: 14px;
        }
        
        .btn {
            flex: 1;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        
        .btn-primary:disabled {
            background: var(--gray-300);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        
        .btn-next {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }
        
        /* 结果提示 */
        .result {
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 18px;
            font-size: 16px;
            font-weight: 600;
            display: none;
        }
        
        .result.correct {
            background: linear-gradient(135deg, var(--success-light) 0%, #a7f3d0 100%);
            color: #065f46;
            display: block;
            border: 1px solid var(--success);
        }
        
        .result.wrong {
            background: linear-gradient(135deg, var(--danger-light) 0%, #fecaca 100%);
            color: #991b1b;
            display: block;
            border: 1px solid var(--danger);
        }
        
        .correct-answer {
            margin-top: 10px;
            font-weight: 500;
            font-size: 15px;
        }
        
        /* 错题集页面 */
        .wrong-questions {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .wrong-questions h2 {
            font-size: 22px;
            color: var(--gray-800);
            margin-bottom: 24px;
            font-weight: 700;
        }
        
        .wrong-item {
            padding: 18px;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            margin-bottom: 14px;
            background: #fff;
            transition: all 0.3s;
        }
        
        .wrong-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .wrong-item .question {
            font-size: 16px;
            color: var(--gray-800);
            margin-bottom: 10px;
            font-weight: 500;
            line-height: 1.6;
        }
        
        .wrong-item .answer {
            font-size: 14px;
            color: var(--success);
            font-weight: 600;
        }
        
        .wrong-item .your-answer {
            font-size: 14px;
            color: var(--danger);
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--gray-400);
            font-size: 16px;
        }
        
        /* 页面切换 */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 进度条 */
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--purple) 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
        }
        
        /* 返回按钮 */
        .btn-back {
            background: rgba(255, 255, 255, 0.9);
            color: var(--gray-700);
            padding: 10px 20px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: translateX(-2px);
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            
            .header, .chapter-select, .question-card, .action-bar, .wrong-questions {
                padding: 20px;
                border-radius: 16px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .question-text {
                font-size: 16px;
            }
            
            .option {
                padding: 14px;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                padding: 14px 20px;
            }
            
            .chapter-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页：章节选择 -->
        <div id="page-home" class="page active">
            <div class="header">
                <h1>近代史答题软件</h1>
                <div class="stats">
                    <div class="stat-item">总题数: <span id="total-questions">0</span></div>
                    <div class="stat-item">单选: <span id="total-single">0</span></div>
                    <div class="stat-item">多选: <span id="total-multi">0</span></div>
                    <div class="stat-item">错题: <span id="total-wrong">0</span></div>
                </div>
            </div>
            
            <div class="chapter-select">
                <h2>选择章节</h2>
                <div class="chapter-buttons" id="chapter-buttons">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div id="resume-section" style="display:none; margin-bottom: 16px;">
                <button class="btn btn-success" onclick="resumeProgress()" style="width:100%">
                    继续上次答题 (<span id="resume-info"></span>)
                </button>
            </div>
            
            <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                <button class="btn btn-primary" onclick="startAll()" style="flex:1">开始全部题目</button>
                <button class="btn btn-next" onclick="showWrongPage()" style="flex:1">查看错题集</button>
            </div>
            <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                <button class="btn btn-success" onclick="startExam()" style="flex:1">模拟演练</button>
                <button class="btn" onclick="showHistoryPage()" style="flex:1; background:#9c27b0; color:#fff">历史记录</button>
            </div>
            
            <div style="background:rgba(0,0,0,0.05); border-radius:12px; padding:16px; margin-top:12px;">
                <div style="font-size:14px; font-weight:600; margin-bottom:12px; color:#333;">云同步</div>
                <button class="btn" onclick="showSyncSettings()" style="width:100%; background:#0078d4; color:#fff; margin-bottom:8px;">同步设置</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn" onclick="uploadToCloud()" style="flex:1; background:#50c878; color:#fff;">⬆ 上传</button>
                    <button class="btn" onclick="forceSyncFromCloud()" style="flex:1; background:#ff6b6b; color:#fff;">⬇ 下载</button>
                </div>
                <div id="sync-status" style="margin-top: 8px; text-align: center; font-size: 12px; color: #666;"></div>
            </div>
        </div>
        
        <!-- 云同步设置弹窗 -->
        <div id="sync-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center;">
            <div style="background:#fff; border-radius:16px; padding:24px; max-width:400px; width:90%;">
                <h3 style="margin-bottom:16px; font-size:18px;">云同步设置</h3>
                <p style="font-size:14px; color:#666; margin-bottom:16px;">
                    使用 GitHub Gist 实现自动同步，手机电脑数据自动保持一致。
                </p>
                <div style="margin-bottom:12px;">
                    <label style="display:block; font-size:14px; margin-bottom:4px; font-weight:500;">GitHub Token</label>
                    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
                    <a href="https://github.com/settings/tokens/new?scopes=gist&description=近代史答题同步" target="_blank" style="font-size:12px; color:#0078d4;">获取 Token (只需 gist 权限)</a>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:14px; margin-bottom:4px; font-weight:500;">Gist ID (可选，首次留空自动创建)</label>
                    <input type="text" id="gist-id" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
                </div>
                <div style="display:flex; gap:12px;">
                    <button onclick="saveSyncSettings()" style="flex:1; padding:12px; background:#0078d4; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px;">保存</button>
                    <button onclick="closeSyncModal()" style="flex:1; padding:12px; background:#eee; color:#333; border:none; border-radius:8px; cursor:pointer; font-size:14px;">取消</button>
                </div>
            </div>
        </div>
        
        <!-- 答题页面 -->
        <div id="page-quiz" class="page">
            <button class="btn-back" onclick="goHome()">← 返回首页</button>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="question-card">
                <div class="question-header">
                    <span class="question-num" id="question-num">第 1 题</span>
                    <span class="question-type" id="question-type">单选题</span>
                </div>
                
                <div class="question-text" id="question-text"></div>
                
                <div class="options" id="options-container">
                    <!-- 动态生成选项 -->
                </div>
                
                <div class="multi-hint" id="multi-hint" style="display:none">
                    * 多选题，请选择所有正确选项
                </div>
            </div>
            
            <div class="result" id="result"></div>
            
            <div class="action-bar">
                <div class="wrong-set-option" id="wrong-set-option" style="display:none">
                    <input type="checkbox" id="add-to-wrong">
                    <label for="add-to-wrong" id="wrong-set-label">加入错题集</label>
                </div>
                
                <div id="delete-wrong-section" style="display:none; margin-bottom: 12px;">
                    <button class="btn" onclick="deleteCurrentWrong()" style="width:100%; background:#ff4444; color:#fff;">删除此题</button>
                </div>
                
                <div class="buttons">
                    <button class="btn btn-primary" id="btn-confirm" onclick="confirmAnswer()">确定</button>
                    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" style="display:none">下一题</button>
                </div>
            </div>
        </div>
        
        <!-- 错题集页面 -->
        <div id="page-wrong" class="page">
            <button class="btn-back" onclick="goHome()">← 返回首页</button>
            
            <div class="wrong-questions">
                <h2>错题集 (<span id="wrong-count">0</span> 题)</h2>
                <div id="wrong-list">
                    <!-- 动态生成 -->
                </div>
                <div class="empty-state" id="empty-wrong" style="display:none">
                    暂无错题，继续加油！
                </div>
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="btn btn-success" onclick="startWrongPractice()" id="btn-practice-wrong" style="flex:1">错题重练</button>
                    <button class="btn btn-primary" onclick="clearWrongQuestions()" style="flex:1">清空错题集</button>
                </div>
            </div>
        </div>
        
        <!-- 模拟演练结果页面 -->
        <div id="page-result" class="page">
            <button class="btn-back" onclick="goHome()">← 返回首页</button>
            
            <div class="question-card" style="text-align: center;">
                <h2 style="margin-bottom: 20px;">模拟演练完成</h2>
                <div style="font-size: 48px; font-weight: bold; color: #1a73e8; margin-bottom: 20px;">
                    <span id="exam-score">0</span> 分
                </div>
                <div style="font-size: 18px; color: #666; margin-bottom: 30px;">
                    共 <span id="exam-total">0</span> 题，答对 <span id="exam-correct">0</span> 题，答错 <span id="exam-wrong">0</span> 题
                </div>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="showExamWrongPage()" style="flex:1">查看本次错题</button>
                    <button class="btn btn-next" onclick="goHome()" style="flex:1">返回首页</button>
                </div>
            </div>
        </div>
        
        <!-- 本次模拟错题页面 -->
        <div id="page-exam-wrong" class="page">
            <button class="btn-back" onclick="showResultPage()">← 返回结果</button>
            
            <div class="wrong-questions">
                <h2>本次模拟错题 (<span id="exam-wrong-count">0</span> 题)</h2>
                <div id="exam-wrong-list">
                    <!-- 动态生成 -->
                </div>
                <div class="empty-state" id="exam-empty-wrong" style="display:none">
                    恭喜！全部答对！
                </div>

                }
                
                if (progress.index < totalInMode) {
                    const modeName = progress.mode === 'all' ? '全部题目' : progress.mode;
                    resumeInfo.textContent = `${modeName} 第${progress.index + 1}题`;
                    resumeSection.style.display = 'block';
                }
            }
            
            // 获取所有章节
            const chapters = [...new Set(allQuestions.map(q => q.chapter))];
            
            // 生成章节按钮
            const container = document.getElementById('chapter-buttons');
            container.innerHTML = '';
            chapters.forEach(chapter => {
                const count = allQuestions.filter(q => q.chapter === chapter).length;
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = `${chapter.replace('第', '第\n')} (${count}题)`;
                btn.onclick = () => startChapter(chapter);
                container.appendChild(btn);
            });
        }
        
        // 开始指定章节
        function startChapter(chapter) {
            currentQuestions = allQuestions.filter(q => q.chapter === chapter);
            currentIndex = 0;
            currentMode = chapter;
            isWrongPractice = false;
            saveProgress();
            showQuestion();
            showPage('page-quiz');
        }
        
        // 开始全部题目
        function startAll() {
            currentQuestions = [...allQuestions];
            currentIndex = 0;
            currentMode = 'all';
            isWrongPractice = false;
            saveProgress();
            showQuestion();
            showPage('page-quiz');
        }
        
        // 开始错题重练
        function startWrongPractice() {
            if (wrongQuestions.length === 0) {
                alert('错题集为空，没有可练习的题目');
                return;
            }
            
            currentQuestions = [...wrongQuestions];
            currentIndex = 0;
            currentMode = 'wrong';
            isWrongPractice = true;
            saveProgress();
            showQuestion();
            showPage('page-quiz');
        }
        
        // 开始模拟演练
        function startExam() {
            const singleQuestions = allQuestions.filter(q => q.type === 'single');
            const multiQuestions = allQuestions.filter(q => q.type === 'multi');
            
            if (singleQuestions.length < 40) {
                alert('单选题数量不足40道');
                return;
            }
            if (multiQuestions.length < 10) {
                alert('多选题数量不足10道');
                return;
            }
            
            // 随机抽取题目
            const shuffledSingle = [...singleQuestions].sort(() => Math.random() - 0.5).slice(0, 40);
            const shuffledMulti = [...multiQuestions].sort(() => Math.random() - 0.5).slice(0, 10);
            
            examQuestions = [...shuffledSingle, ...shuffledMulti];
            examAnswers = {};
            examStartTime = Date.now();
            
            currentQuestions = examQuestions;
            currentIndex = 0;
            currentMode = 'exam';
            isExamMode = true;
            isWrongPractice = false;
            
            showQuestion();
            showPage('page-quiz');
        }
        
        // 显示模拟结果页面
        function showResultPage() {
            showPage('page-result');
        }
        
        // 显示本次模拟错题页面
        function showExamWrongPage() {
            const examWrong = getExamWrongQuestions();
            document.getElementById('exam-wrong-count').textContent = examWrong.length;
            
            const listContainer = document.getElementById('exam-wrong-list');
            const emptyState = document.getElementById('exam-empty-wrong');
            
            if (examWrong.length === 0) {
                listContainer.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                listContainer.innerHTML = examWrong.map((item, index) => {
                    const q = item.question;
                    const isInWrongSet = wrongQuestions.some(wq => 
                        wq.question === q.question && wq.chapter === q.chapter
                    );
                    return `
                        <div class="wrong-item" id="exam-wrong-${index}">
                            <div class="question">${index + 1}. ${q.question}</div>
                            <div class="your-answer">你的答案: ${item.userAnswer || '未作答'}</div>
                            <div class="answer">正确答案: ${q.answer}</div>
                            <div style="margin-top:8px; font-size:12px; color:#666">
                                ${q.chapter} | ${q.type === 'single' ? '单选题' : '多选题'}
                            </div>
                            <button onclick="addExamWrongToWrongSet(${index})" 
                                    style="margin-top:8px; padding:6px 12px; font-size:13px; cursor:pointer; ${isInWrongSet ? 'background:#ccc' : ''}"
                                    ${isInWrongSet ? 'disabled' : ''}>
                                ${isInWrongSet ? '已在错题集中' : '加入错题集'}
                            </button>
                        </div>
                    `;
                }).join('');
            }
            
            showPage('page-exam-wrong');
        }
        
        // 获取本次模拟错题
        function getExamWrongQuestions() {
            const wrong = [];
            examQuestions.forEach((q, index) => {
                const userAnswerIndices = examAnswers[index] || [];
                const correctAnswer = q.answer;
                
                let correctIndices = [];
                for (let char of correctAnswer) {
                    const idx = q.option_labels.indexOf(char);
                    if (idx > -1) {
                        correctIndices.push(idx);
                    }
                }
                
                const isCorrect = userAnswerIndices.length === correctIndices.length && 
                                 userAnswerIndices.every(idx => correctIndices.includes(idx));
                
                if (!isCorrect) {
                    wrong.push({
                        question: q,
                        userAnswer: userAnswerIndices.map(i => q.option_labels[i]).join(''),
                        index: index
                    });
                }
            });
            return wrong;
        }
        
        // 将本次模拟错题加入错题集
        function addExamWrongToWrongSet(index) {
            const examWrong = getExamWrongQuestions();
            if (index >= examWrong.length) return;
            
            const item = examWrong[index];
            const exists = wrongQuestions.some(wq => 
                wq.question === item.question.question && wq.chapter === item.question.chapter
            );
            
            if (!exists) {
                wrongQuestions.push({
                    ...item.question,
                    userAnswer: item.userAnswer
                });
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                document.getElementById('total-wrong').textContent = wrongQuestions.length;
                
                // 更新按钮状态
                const btn = document.querySelector(`#exam-wrong-${index} button`);
                if (btn) {
                    btn.textContent = '已在错题集中';
                    btn.disabled = true;
                    btn.style.background = '#ccc';
                }
            }
        }
        
        // 将所有本次模拟错题加入错题集
        function addAllExamWrongToWrongSet() {
            const examWrong = getExamWrongQuestions();
            let addedCount = 0;
            
            examWrong.forEach(item => {
                const exists = wrongQuestions.some(wq => 
                    wq.question === item.question.question && wq.chapter === item.question.chapter
                );
                
                if (!exists) {
                    wrongQuestions.push({
                        ...item.question,
                        userAnswer: item.userAnswer
                    });
                    addedCount++;
                }
            });
            
            if (addedCount > 0) {
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                document.getElementById('total-wrong').textContent = wrongQuestions.length;
                alert(`已将 ${addedCount} 道错题加入错题集`);
                showExamWrongPage(); // 刷新页面
            } else {
                alert('所有错题都已在错题集中');
            }
        }
        
        // 显示历史记录页面
        function showHistoryPage() {
            const listContainer = document.getElementById('history-list');
            const emptyState = document.getElementById('empty-history');
            
            if (examHistory.length === 0) {
                listContainer.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                listContainer.innerHTML = examHistory.map((record, index) => `
                    <div class="wrong-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <div style="font-size: 18px; font-weight: bold; color: ${record.score >= 60 ? '#4caf50' : '#f44336'}">
                                ${record.score} 分
                            </div>
                            <div style="font-size: 12px; color: #999;">
                                ${new Date(record.timestamp).toLocaleString()}
                            </div>
                        </div>
                        <div style="font-size: 14px; color: #666; margin-bottom: 8px;">
                            共 ${record.total} 题，答对 ${record.correct} 题，答错 ${record.wrong} 题
                        </div>
                        <button onclick="showHistoryDetail(${index})" 
                                style="padding: 6px 12px; font-size: 13px; cursor: pointer;">
                            查看详情
                        </button>
                    </div>
                `).join('');
            }
            
            showPage('page-history');
        }
        
        // 查看历史记录详情
        function showHistoryDetail(index) {
            if (index >= examHistory.length) return;
            
            const record = examHistory[index];
            const wrongList = record.wrongQuestions || [];
            
            document.getElementById('exam-wrong-count').textContent = wrongList.length;
            
            const listContainer = document.getElementById('exam-wrong-list');
            const emptyState = document.getElementById('exam-empty-wrong');
            
            if (wrongList.length === 0) {
                listContainer.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                listContainer.innerHTML = wrongList.map((item, i) => {
                    const q = item.question;
                    const isInWrongSet = wrongQuestions.some(wq => 
                        wq.question === q.question && wq.chapter === q.chapter
                    );
                    return `
                        <div class="wrong-item">
                            <div class="question">${i + 1}. ${q.question}</div>
                            <div class="your-answer">你的答案: ${item.userAnswer || '未作答'}</div>
                            <div class="answer">正确答案: ${q.answer}</div>
                            <div style="margin-top:8px; font-size:12px; color:#666">
                                ${q.chapter} | ${q.type === 'single' ? '单选题' : '多选题'}
                            </div>
                            <button onclick="addHistoryWrongToWrongSet(${index}, ${i})" 
                                    style="margin-top:8px; padding:6px 12px; font-size:13px; cursor:pointer; ${isInWrongSet ? 'background:#ccc' : ''}"
                                    ${isInWrongSet ? 'disabled' : ''}>
                                ${isInWrongSet ? '已在错题集中' : '加入错题集'}
                            </button>
                        </div>
                    `;
                }).join('');
            }
            
            // 修改返回按钮的行为
            document.querySelector('#page-exam-wrong .btn-back').setAttribute('onclick', 'showHistoryPage()');
            showPage('page-exam-wrong');
        }
        
        // 将历史记录中的错题加入错题集
        function addHistoryWrongToWrongSet(historyIndex, wrongIndex) {
            if (historyIndex >= examHistory.length) return;
            
            const record = examHistory[historyIndex];
            const wrongList = record.wrongQuestions || [];
            
            if (wrongIndex >= wrongList.length) return;
            
            const item = wrongList[wrongIndex];
            const exists = wrongQuestions.some(wq => 
                wq.question === item.question.question && wq.chapter === item.question.chapter
            );
            
            if (!exists) {
                wrongQuestions.push({
                    ...item.question,
                    userAnswer: item.userAnswer
                });
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                document.getElementById('total-wrong').textContent = wrongQuestions.length;
                
                // 更新按钮状态
                const btns = document.querySelectorAll('#page-exam-wrong .wrong-item button');
                if (btns[wrongIndex]) {
                    btns[wrongIndex].textContent = '已在错题集中';
                    btns[wrongIndex].disabled = true;
                    btns[wrongIndex].style.background = '#ccc';
                }
            }
        }
        
        // 清空历史记录
        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？')) {
                examHistory = [];
                localStorage.setItem('examHistory', JSON.stringify(examHistory));
                showHistoryPage();
            }
        }
        
        // 继续上次答题
        function resumeProgress() {
            const progress = loadProgress();
            if (!progress || !progress.mode) {
                alert('没有找到保存的进度');
                return;
            }
            
            currentMode = progress.mode;
            if (currentMode === 'wrong') {
                currentQuestions = [...wrongQuestions];
                isWrongPractice = true;
            } else if (currentMode === 'all') {
                currentQuestions = [...allQuestions];
                isWrongPractice = false;
            } else {
                currentQuestions = allQuestions.filter(q => q.chapter === currentMode);
                isWrongPractice = false;
            }
            
            currentIndex = Math.min(progress.index, currentQuestions.length - 1);
            showQuestion();
            showPage('page-quiz');
        }
        
        // 显示题目
        function showQuestion() {
            if (currentIndex >= currentQuestions.length) {
                clearProgress();
                alert('恭喜！已完成所有题目！');
                goHome();
                return;
            }
            
            const q = currentQuestions[currentIndex];
            isAnswered = false;
            selectedAnswers = [];
            
            // 更新进度
            document.getElementById('progress-fill').style.width = 
                ((currentIndex / currentQuestions.length) * 100) + '%';
            
            // 题目信息
            document.getElementById('question-num').textContent = 
                `第 ${currentIndex + 1} / ${currentQuestions.length} 题`;
            
            const typeSpan = document.getElementById('question-type');
            typeSpan.textContent = q.type === 'single' ? '单选题' : '多选题';
            typeSpan.className = 'question-type ' + (q.type === 'single' ? 'type-single' : 'type-multi');
            
            // 模拟演练模式下显示特殊标题
            if (isExamMode) {
                document.getElementById('question-num').textContent = 
                    `模拟演练 - 第 ${currentIndex + 1} / ${currentQuestions.length} 题`;
            }
            
            // 题目文本
            document.getElementById('question-text').textContent = q.question;
            
            // 多选提示
            document.getElementById('multi-hint').style.display = 
                q.type === 'multi' ? 'block' : 'none';
            
            // 生成选项
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.option_labels.forEach((label, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <div class="option-letter">${label}</div>
                    <div class="option-text">${q.options[i]}</div>
                `;
                div.onclick = () => selectOption(i);
                container.appendChild(div);
            });
            
            // 重置状态
            document.getElementById('result').className = 'result';
            document.getElementById('result').textContent = '';
            document.getElementById('wrong-set-option').style.display = 'none';
            document.getElementById('add-to-wrong').checked = false;
            document.getElementById('btn-confirm').style.display = 'block';
            document.getElementById('btn-next').style.display = 'none';
            
            // 错题重练模式下显示删除按钮
            document.getElementById('delete-wrong-section').style.display = 
                isWrongPractice ? 'block' : 'none';
        }
        
        // 选择选项
        function selectOption(index) {
            if (isAnswered) return;
            
            const q = currentQuestions[currentIndex];
            
            if (q.type === 'single') {
                // 单选：只能选一个
                selectedAnswers = [index];
                document.querySelectorAll('.option').forEach((opt, i) => {
                    opt.classList.toggle('selected', i === index);
                });
            } else {
                // 多选：可以选多个
                const idx = selectedAnswers.indexOf(index);
                if (idx > -1) {
                    selectedAnswers.splice(idx, 1);
                } else {
                    selectedAnswers.push(index);
                }
                document.querySelectorAll('.option').forEach((opt, i) => {
                    opt.classList.toggle('selected', selectedAnswers.includes(i));
                });
            }
        }
        
        // 确认答案
        function confirmAnswer() {
            if (selectedAnswers.length === 0) {
                alert('请先选择答案');
                return;
            }
            
            isAnswered = true;
            const q = currentQuestions[currentIndex];
            const correctAnswer = q.answer;
            
            // 解析正确答案
            let correctIndices = [];
            for (let char of correctAnswer) {
                const idx = q.option_labels.indexOf(char);
                if (idx > -1) {
                    correctIndices.push(idx);
                }
            }
            
            // 判断对错
            const isCorrect = selectedAnswers.length === correctIndices.length && 
                             selectedAnswers.every(idx => correctIndices.includes(idx));
            
            // 更新选项样式
            document.querySelectorAll('.option').forEach((opt, i) => {
                if (correctIndices.includes(i)) {
                    opt.classList.add('correct');
                } else if (selectedAnswers.includes(i)) {
                    opt.classList.add('wrong');
                }
            });
            
            // 显示结果
            const resultDiv = document.getElementById('result');
            if (isCorrect) {
                resultDiv.className = 'result correct';
                resultDiv.innerHTML = '✓ 回答正确！';
                
                if (isWrongPractice) {
                    // 错题重练模式下，答对了显示"从错题集移除"选项
                    document.getElementById('wrong-set-option').style.display = 'flex';
                    document.getElementById('wrong-set-label').textContent = '从错题集移除';
                    document.getElementById('add-to-wrong').checked = true;
                } else if (!isExamMode) {
                    // 正常模式下，显示"加入错题集"选项
                    document.getElementById('wrong-set-option').style.display = 'flex';
                    document.getElementById('wrong-set-label').textContent = '加入错题集';
                    document.getElementById('add-to-wrong').checked = false;
                }
            } else {
                resultDiv.className = 'result wrong';
                resultDiv.innerHTML = `
                    ✗ 回答错误
                    <div class="correct-answer">正确答案是: ${correctAnswer}</div>
                `;
                
                if (!isWrongPractice && !isExamMode) {
                    // 正常模式下，自动加入错题集
                    addToWrongQuestions(q, selectedAnswers);
                }
            }
            
            // 模拟演练模式下记录答案
            if (isExamMode) {
                examAnswers[currentIndex] = [...selectedAnswers];
            }
            
            // 切换按钮
            document.getElementById('btn-confirm').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
        }
        
        // 下一题
        function nextQuestion() {
            const currentQuestion = currentQuestions[currentIndex];
            
            if (isWrongPractice) {
                // 错题重练模式
                if (document.getElementById('add-to-wrong').checked && isAnswered) {
                    removeFromWrongQuestions(currentQuestion);
                }
            } else if (!isExamMode) {
                // 正常模式
                if (document.getElementById('add-to-wrong').checked) {
                    addToWrongQuestions(currentQuestion, selectedAnswers);
                }
            }
            
            currentIndex++;
            
            // 检查是否完成所有题目
            if (currentIndex >= currentQuestions.length) {
                if (isExamMode) {
                    finishExam();
                } else {
                    clearProgress();
                    alert('恭喜！已完成所有题目！');
                    goHome();
                }
                return;
            }
            
            saveProgress();
            showQuestion();
        }
        
        // 完成模拟演练
        function finishExam() {
            // 计算分数
            let correctCount = 0;
            examQuestions.forEach((q, index) => {
                const userAnswerIndices = examAnswers[index] || [];
                const correctAnswer = q.answer;
                
                let correctIndices = [];
                for (let char of correctAnswer) {
                    const idx = q.option_labels.indexOf(char);
                    if (idx > -1) {
                        correctIndices.push(idx);
                    }
                }
                
                const isCorrect = userAnswerIndices.length === correctIndices.length && 
                                 userAnswerIndices.every(idx => correctIndices.includes(idx));
                
                if (isCorrect) {
                    correctCount++;
                }
            });
            
            const totalQuestions = examQuestions.length;
            const wrongCount = totalQuestions - correctCount;
            const score = correctCount * 2; // 每题2分
            
            // 保存历史记录
            const examRecord = {
                timestamp: examStartTime || Date.now(),
                score: score,
                total: totalQuestions,
                correct: correctCount,
                wrong: wrongCount,
                wrongQuestions: getExamWrongQuestions(),
                questions: examQuestions.map(q => ({
                    question: q.question,
                    chapter: q.chapter,
                    type: q.type,
                    answer: q.answer,
                    options: q.options,
                    option_labels: q.option_labels
                }))
            };
            
            examHistory.unshift(examRecord); // 添加到开头
            if (examHistory.length > 20) { // 最多保存20条记录
                examHistory = examHistory.slice(0, 20);
            }
            localStorage.setItem('examHistory', JSON.stringify(examHistory));
            
            // 更新结果页面
            document.getElementById('exam-score').textContent = score;
            document.getElementById('exam-total').textContent = totalQuestions;
            document.getElementById('exam-correct').textContent = correctCount;
            document.getElementById('exam-wrong').textContent = wrongCount;
            
            // 重置模拟模式状态
            isExamMode = false;
            
            // 显示结果页面
            showPage('page-result');
        }
        
        // 添加到错题集
        function addToWrongQuestions(question, userAnswerIndices) {
            const exists = wrongQuestions.find(wq => 
                wq.question === question.question && wq.chapter === question.chapter
            );
            
            if (!exists) {
                const userAnswer = userAnswerIndices.map(i => question.option_labels[i]).join('');
                wrongQuestions.push({
                    ...question,
                    userAnswer: userAnswer
                });
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                document.getElementById('total-wrong').textContent = wrongQuestions.length;
            }
        }
        
        // 从错题集移除
        function removeFromWrongQuestions(question) {
            wrongQuestions = wrongQuestions.filter(wq => 
                !(wq.question === question.question && wq.chapter === question.chapter)
            );
            localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
            document.getElementById('total-wrong').textContent = wrongQuestions.length;
        }
        
        // 删除当前错题（错题重练模式下）
        function deleteCurrentWrong() {
            if (!isWrongPractice) return;
            
            const currentQuestion = currentQuestions[currentIndex];
            
            if (confirm('确定要删除这道错题吗？')) {
                removeFromWrongQuestions(currentQuestion);
                
                // 从当前题目列表中移除
                currentQuestions.splice(currentIndex, 1);
                
                // 如果当前索引超出范围，回到第一题
                if (currentIndex >= currentQuestions.length) {
                    currentIndex = 0;
                }
                
                // 如果没有题目了，返回首页
                if (currentQuestions.length === 0) {
                    alert('错题集已清空！');
                    goHome();
                    return;
                }
                
                // 显示下一题
                showQuestion();
            }
        }
        
        // 显示错题集页面
        function showWrongPage() {
            document.getElementById('wrong-count').textContent = wrongQuestions.length;
            
            const listContainer = document.getElementById('wrong-list');
            const emptyState = document.getElementById('empty-wrong');
            
            if (wrongQuestions.length === 0) {
                listContainer.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                listContainer.innerHTML = wrongQuestions.map((q, index) => `
                    <div class="wrong-item">
                        <div class="question">${index + 1}. ${q.question}</div>
                        <div class="your-answer">你的答案: ${q.userAnswer || '未作答'}</div>
                        <div class="answer">正确答案: ${q.answer}</div>
                        <div style="margin-top:8px; font-size:12px; color:#666">
                            ${q.chapter} | ${q.type === 'single' ? '单选题' : '多选题'}
                        </div>
                        <button onclick="removeWrongQuestion(${index})" 
                                style="margin-top:8px; padding:4px 8px; font-size:12px; cursor:pointer">
                            移除
                        </button>
                    </div>
                `).join('');
            }
            
            showPage('page-wrong');
        }
        
        // 移除错题
        function removeWrongQuestion(index) {
            wrongQuestions.splice(index, 1);
            localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
            document.getElementById('total-wrong').textContent = wrongQuestions.length;
            showWrongPage();
        }
        
        // 清空错题集
        function clearWrongQuestions() {
            if (confirm('确定要清空错题集吗？')) {
                wrongQuestions = [];
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                document.getElementById('total-wrong').textContent = 0;
                showWrongPage();
            }
        }
        
        // 页面切换
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
        
        // 返回首页
        function goHome() {
            isExamMode = false;
            isWrongPractice = false;
            saveProgress();
            initApp(); // 刷新首页显示
            showPage('page-home');
        }
        
        // ==================== 云同步功能 ====================
        
        // 获取同步配置
        function getSyncConfig() {
            return {
                token: localStorage.getItem('github_token') || '',
                gistId: localStorage.getItem('gist_id') || ''
            };
        }
        
        // 显示同步设置弹窗
        function showSyncSettings() {
            const config = getSyncConfig();
            document.getElementById('github-token').value = config.token;
            document.getElementById('gist-id').value = config.gistId;
            document.getElementById('sync-modal').style.display = 'flex';
        }
        
        // 关闭同步设置弹窗
        function closeSyncModal() {
            document.getElementById('sync-modal').style.display = 'none';
        }
        
        // 保存同步设置
        function saveSyncSettings() {
            const token = document.getElementById('github-token').value.trim();
            const gistId = document.getElementById('gist-id').value.trim();
            
            localStorage.setItem('github_token', token);
            localStorage.setItem('gist_id', gistId);
            
            closeSyncModal();
            updateSyncStatus();
            
            if (token) {
                // 如果有 token，立即同步
                syncToCloud();
            }
        }
        
        // 更新同步状态显示
        function updateSyncStatus() {
            const config = getSyncConfig();
            const statusEl = document.getElementById('sync-status');
            
            if (config.token) {
                if (config.gistId) {
                    statusEl.textContent = '云同步已开启 (Gist: ' + config.gistId.substring(0, 8) + '...)';
                    statusEl.style.color = '#50c878';
                } else {
                    statusEl.textContent = '云同步已配置，等待首次同步...';
                    statusEl.style.color = '#ffa500';
                }
            } else {
                statusEl.textContent = '云同步未配置';
                statusEl.style.color = '#999';
            }
        }
        
        // 上传到云端
        async function uploadToCloud() {
            const config = getSyncConfig();
            if (!config.token || !config.gistId) {
                alert('请先配置云同步！');
                showSyncSettings();
                return;
            }
            
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = '正在上传...';
            statusEl.style.color = '#0078d4';
            
            try {
                const data = {
                    wrongQuestions: JSON.parse(localStorage.getItem('wrongQuestions') || '[]'),
                    examHistory: JSON.parse(localStorage.getItem('examHistory') || '[]'),
                    progress: JSON.parse(localStorage.getItem('quizProgress') || 'null'),
                    lastSync: new Date().toISOString()
                };
                
                const response = await fetch('https://api.github.com/gists/' + config.gistId, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'token ' + config.token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'quiz-data.json': {
                                content: JSON.stringify(data)
                            }
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error('上传失败 (' + response.status + ')');
                }
                
                statusEl.textContent = '上传成功！错题: ' + data.wrongQuestions.length;
                statusEl.style.color = '#50c878';
                
            } catch (error) {
                statusEl.textContent = '上传失败: ' + error.message;
                statusEl.style.color = '#ef4444';
            }
        }
        
        // 从云端加载数据
        async function loadFromCloud() {
            const config = getSyncConfig();
            if (!config.token || !config.gistId) {
                return false;
            }
            
            try {
                const response = await fetch('https://api.github.com/gists/' + config.gistId, {
                    headers: {
                        'Authorization': 'token ' + config.token,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('加载失败 (' + response.status + ')');
                }
                
                const gist = await response.json();
                
                if (!gist.files || !gist.files['quiz-data.json']) {
                    return false;
                }
                
                const content = gist.files['quiz-data.json'].content;
                const data = JSON.parse(content);
                
                wrongQuestions = data.wrongQuestions || [];
                examHistory = data.examHistory || [];
                
                localStorage.setItem('wrongQuestions', JSON.stringify(wrongQuestions));
                localStorage.setItem('examHistory', JSON.stringify(examHistory));
                
                return true;
                
            } catch (error) {
                console.error('加载失败:', error.message);
                return false;
            }
        }
        
        // 强制从云端同步
        async function forceSyncFromCloud() {
            const config = getSyncConfig();
            if (!config.token || !config.gistId) {
                alert('请先配置云同步！');
                showSyncSettings();
                return;
            }
            
            if (!confirm('确定要从云端下载数据吗？\n这会覆盖本地数据！')) {
                return;
            }
            
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = '正在下载...';
            statusEl.style.color = '#0078d4';
            
            try {
                const response = await fetch('https://api.github.com/gists/' + config.gistId, {
                    headers: {
                        'Authorization': 'token ' + config.token,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('下载失败 (' + response.status + ')');
                }
                
                const gist = await response.json();
                
                if (!gist.files || !gist.files['quiz-data.json']) {
                    throw new Error('云端没有数据');
                }
                
                const content = gist.files['quiz-data.json'].content;
                const data = JSON.parse(content);
                
                // 保存到本地
                localStorage.setItem('wrongQuestions', JSON.stringify(data.wrongQuestions || []));
                localStorage.setItem('examHistory', JSON.stringify(data.examHistory || []));
                
                // 恢复做题进度
                if (data.progress) {
                    localStorage.setItem('quizProgress', JSON.stringify(data.progress));
                }
                
                statusEl.textContent = '下载成功！错题: ' + (data.wrongQuestions || []).length;
                statusEl.style.color = '#50c878';
                
                // 刷新页面
                setTimeout(() => window.location.reload(), 500);
                
            } catch (error) {
                statusEl.textContent = '下载失败: ' + error.message;
                statusEl.style.color = '#ef4444';
            }
        }
        
        // 键盘操作
        document.addEventListener('keydown', function(e) {
            // 检查当前是否在答题页面
            const quizPage = document.getElementById('page-quiz');
            if (!quizPage.classList.contains('active')) {
                return;
            }
            
            const q = currentQuestions[currentIndex];
            if (!q) return;
            
            // 数字键 1-5 选择选项
            if (e.key >= '1' && e.key <= '5') {
                const optionIndex = parseInt(e.key) - 1;
                if (optionIndex < q.options.length) {
                    selectOption(optionIndex);
                }
                return;
            }
            
            // Enter 键确认/下一题
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!isAnswered) {
                    // 如果还没答题，确认答案
                    if (selectedAnswers.length > 0) {
                        confirmAnswer();
                    }
                } else {
                    // 如果已经答题，下一题
                    nextQuestion();
                }
                return;
            }
            
            // J 键切换加入错题集选项
            if (e.key === 'j' || e.key === 'J') {
                const checkbox = document.getElementById('add-to-wrong');
                const wrongSetOption = document.getElementById('wrong-set-option');
                if (wrongSetOption.style.display !== 'none') {
                    checkbox.checked = !checkbox.checked;
                }
                return;
            }
        });
        
        // 自动同步
        function autoSave() {
            const config = getSyncConfig();
            if (config.token && config.gistId) {
                const now = new Date().toISOString();
                
                // 静默上传，不显示状态
                const data = {
                    wrongQuestions: JSON.parse(localStorage.getItem('wrongQuestions') || '[]'),
                    examHistory: JSON.parse(localStorage.getItem('examHistory') || '[]'),
                    progress: JSON.parse(localStorage.getItem('quizProgress') || 'null'),
                    lastSync: now
                };
                
                // 更新本地时间戳
                localStorage.setItem('last_sync', now);
                
                fetch('https://api.github.com/gists/' + config.gistId, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'token ' + config.token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'quiz-data.json': {
                                content: JSON.stringify(data)
                            }
                        }
                    })
                }).catch(() => {}); // 静默失败
            }
        }
        
        // 监听数据变化，自动保存
        function watchChanges() {
            // 每30秒自动保存一次
            setInterval(autoSave, 30000);
            
            // 监听 localStorage 变化
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function(key, value) {
                originalSetItem.call(this, key, value);
                if (key === 'wrongQuestions' || key === 'examHistory' || key === 'quizProgress') {
                    // 数据变化后延迟2秒保存（避免频繁保存）
                    clearTimeout(window._autoSaveTimer);
                    window._autoSaveTimer = setTimeout(autoSave, 2000);
                }
            };
        }
        
        // 智能同步：比较本地和云端数据，保留最新的
        async function smartSync() {
            const config = getSyncConfig();
            if (!config.token || !config.gistId) return;
            
            try {
                // 获取云端数据
                const response = await fetch('https://api.github.com/gists/' + config.gistId, {
                    headers: {
                        'Authorization': 'token ' + config.token,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) return;
                
                const gist = await response.json();
                if (!gist.files || !gist.files['quiz-data.json']) return;
                
                const cloudData = JSON.parse(gist.files['quiz-data.json'].content);
                const cloudSync = cloudData.lastSync;
                const localSync = localStorage.getItem('last_sync');
                
                // 获取本地数据
                const localData = {
                    wrongQuestions: JSON.parse(localStorage.getItem('wrongQuestions') || '[]'),
                    examHistory: JSON.parse(localStorage.getItem('examHistory') || '[]'),
                    progress: JSON.parse(localStorage.getItem('quizProgress') || 'null'),
                    lastSync: localSync
                };
                
                // 使用时间戳判断哪个数据更新
                const cloudTime = cloudSync ? new Date(cloudSync).getTime() : 0;
                const localTime = localSync ? new Date(localSync).getTime() : 0;
                
                if (cloudTime > localTime) {
                    // 云端数据更新，使用云端数据
                    localStorage.setItem('wrongQuestions', JSON.stringify(cloudData.wrongQuestions || []));
                    localStorage.setItem('examHistory', JSON.stringify(cloudData.examHistory || []));
                    if (cloudData.progress) {
                        localStorage.setItem('quizProgress', JSON.stringify(cloudData.progress));
                    }
                    localStorage.setItem('last_sync', cloudSync);
                    
                    // 刷新显示
                    wrongQuestions = cloudData.wrongQuestions || [];
                    examHistory = cloudData.examHistory || [];
                    initApp();
                } else if (localTime > cloudTime) {
                    // 本地数据更新，上传到云端
                    const uploadData = {
                        ...localData,
                        lastSync: new Date().toISOString()
                    };
                    
                    await fetch('https://api.github.com/gists/' + config.gistId, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': 'token ' + config.token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            files: {
                                'quiz-data.json': {
                                    content: JSON.stringify(uploadData)
                                }
                            }
                        })
                    });
                    
                    localStorage.setItem('last_sync', uploadData.lastSync);
                }
            } catch (e) {
                // 静默失败
            }
        }
        
        // 启动
        async function init() {
            await loadQuestions();
            updateSyncStatus();
            
            // 页面加载时智能同步
            await smartSync();
            
            // 启动自动保存
            watchChanges();
        }
        init();
    </script>
</body>
</html>
